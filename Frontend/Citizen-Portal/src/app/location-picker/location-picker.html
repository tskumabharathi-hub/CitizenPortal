<div class="picker-container">

    <div class="toolbar">

        <h2>📍 Select Location</h2>

        <button
            mat-raised-button
            color="primary"
            (click)="useCurrentLocation()">

            Use Current Location

        </button>

    </div>

    <div id="map"></div>

    <div class="details">

        <div>

            <label>Latitude</label>

            <input
                readonly
                [value]="latitude">

        </div>

        <div>

            <label>Longitude</label>

            <input
                readonly
                [value]="longitude">

        </div>

    </div>

    

    <div class="actions">
        <button
            mat-stroked-button
            color="warn"
            (click)="cancel()">
            Cancel
        </button>

        <button
            mat-raised-button
            color="primary"
            (click)="selectLocation()">
            Select Location
        </button>
    </div>

</div>
