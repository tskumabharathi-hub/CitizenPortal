<div class="container">
    <div class="signup-card">
        <h1>Citizen Login</h1>
        <label>Email:</label>
        <input
            type="text"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="contactInfo"
            #contactInfoRef="ngModel"
            required
            [pattern]="emailOrPhonePattern">
        <label>Password:</label>
        <input
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="password">
        <button
            class="create-btn"
            (click)="login()">
            Login
        </button>

        <p *ngIf="loginError" class="error">{{loginError}}</p>
    </div>
</div>
